<svg xmlns="http://www.w3.org/2000/svg" width="985" height="706" viewBox="0 0 985 706">
<rect width="100%" height="100%" rx="10" fill="#0d1117"/>
<rect width="100%" height="32" rx="10" fill="#161b22"/><rect y="22" width="100%" height="10" fill="#161b22"/>
<circle cx="20" cy="16" r="6" fill="#ff5f57"/><circle cx="40" cy="16" r="6" fill="#febc2e"/><circle cx="60" cy="16" r="6" fill="#28c840"/>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14">
<text x="22" y="59" xml:space="preserve"><tspan fill="#7ee787" font-weight="700">$ npx github:qiwei66/model-bump probe -- python agent.py</tspan></text>
<text x="22" y="79" xml:space="preserve"></text>
<text x="22" y="99" xml:space="preserve"><tspan fill="#8b949e">[model-bump]</tspan><tspan fill="#e6edf3"> emulating </tspan><tspan fill="#e6edf3" font-weight="700">Claude Opus 5.5</tspan><tspan fill="#e6edf3"> at http://127.0.0.1:41337 → running: </tspan><tspan fill="#e6edf3" font-weight="700">python agent.py</tspan></text>
<text x="22" y="119" xml:space="preserve"><tspan fill="#8b949e">[model-bump]</tspan><tspan fill="#e6edf3"> #1 </tspan><tspan fill="#8b949e">messages model=claude-opus-5-5 tools=1</tspan><tspan fill="#e6edf3"> → </tspan><tspan fill="#ff7b72" font-weight="700">400</tspan><tspan fill="#e6edf3">  </tspan><tspan fill="#ff7b72">forced-tool-choice</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#ff7b72">sampling-params</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#e3b341">effort-default</tspan></text>
<text x="22" y="139" xml:space="preserve"><tspan fill="#e6edf3">classify: AnthropicInvalidRequestError</tspan></text>
<text x="22" y="159" xml:space="preserve"><tspan fill="#8b949e">[model-bump]</tspan><tspan fill="#e6edf3"> #2 </tspan><tspan fill="#8b949e">messages model=claude-opus-5-5 tools=1</tspan><tspan fill="#e6edf3"> → </tspan><tspan fill="#ff7b72" font-weight="700">400</tspan><tspan fill="#e6edf3">  </tspan><tspan fill="#ff7b72">sampling-params</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#e3b341">effort-default</tspan></text>
<text x="22" y="179" xml:space="preserve"><tspan fill="#e6edf3">extract: AnthropicInvalidRequestError</tspan></text>
<text x="22" y="199" xml:space="preserve"></text>
<text x="22" y="219" xml:space="preserve"><tspan fill="#e6edf3" font-weight="700">model-bump probe</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#8b949e">·</tspan><tspan fill="#e6edf3"> 2 requests checked against </tspan><tspan fill="#e6edf3" font-weight="700">Claude Opus 5.5</tspan></text>
<text x="22" y="239" xml:space="preserve"></text>
<text x="22" y="259" xml:space="preserve"><tspan fill="#ff7b72" font-weight="700">✖ error</tspan><tspan fill="#e6edf3">  </tspan><tspan fill="#e6edf3" font-weight="700">Non-default sampling parameters are rejected (temperature=0)</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#8b949e">[sampling-params]</tspan></text>
<text x="22" y="279" xml:space="preserve"><tspan fill="#e6edf3">    </tspan><tspan fill="#56d4dd">requests #1, #2</tspan><tspan fill="#e6edf3">  </tspan><tspan fill="#8b949e">model=claude-opus-5-5  ua=langchain-anthropic/1.7.4</tspan></text>
<text x="22" y="299" xml:space="preserve"><tspan fill="#e6edf3">    </tspan><tspan fill="#8b949e">API error (paraphrased):</tspan><tspan fill="#e6edf3"> temperature: non-default sampling parameters are not supported for this model.</tspan></text>
<text x="22" y="319" xml:space="preserve"><tspan fill="#e6edf3">    </tspan><tspan fill="#7ee787">fix:</tspan><tspan fill="#e6edf3"> Omit temperature / top_p / top_k. Framework wrappers (e.g. ChatAnthropic(temperature=0)) send them for</tspan></text>
<text x="22" y="339" xml:space="preserve"><tspan fill="#e6edf3">          </tspan><tspan fill="#e6edf3">you — remove them there too.</tspan></text>
<text x="22" y="359" xml:space="preserve"><tspan fill="#e6edf3">    </tspan><tspan fill="#8b949e">docs: https://platform.claude.com/docs/en/models/opus-5-5/migration-guide#request-requirements</tspan></text>
<text x="22" y="379" xml:space="preserve"></text>
<text x="22" y="399" xml:space="preserve"><tspan fill="#ff7b72" font-weight="700">✖ error</tspan><tspan fill="#e6edf3">  </tspan><tspan fill="#e6edf3" font-weight="700">tool_choice {type: "any"} is rejected — forced tool use is not supported</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#8b949e">[forced-tool-choice]</tspan></text>
<text x="22" y="419" xml:space="preserve"><tspan fill="#e6edf3">    </tspan><tspan fill="#56d4dd">requests #1</tspan><tspan fill="#e6edf3">  </tspan><tspan fill="#8b949e">model=claude-opus-5-5  ua=langchain-anthropic/1.7.4</tspan></text>
<text x="22" y="439" xml:space="preserve"><tspan fill="#e6edf3">    </tspan><tspan fill="#8b949e">API error (verbatim):</tspan><tspan fill="#e6edf3"> tool_choice: type "tool" and "any" are not supported for this model.</tspan></text>
<text x="22" y="459" xml:space="preserve"><tspan fill="#e6edf3">    </tspan><tspan fill="#7ee787">fix:</tspan><tspan fill="#e6edf3"> Use tool_choice "auto" plus strict tool use (`strict: true`) or structured outputs</tspan></text>
<text x="22" y="479" xml:space="preserve"><tspan fill="#e6edf3">          </tspan><tspan fill="#e6edf3">(`output_config.format`), and say in the prompt when the tool applies.</tspan></text>
<text x="22" y="499" xml:space="preserve"><tspan fill="#e6edf3">    </tspan><tspan fill="#8b949e">docs: https://platform.claude.com/docs/en/models/opus-5-5/migration-guide#forced-tool-use</tspan></text>
<text x="22" y="519" xml:space="preserve"></text>
<text x="22" y="539" xml:space="preserve"><tspan fill="#e3b341" font-weight="700">▲ warn </tspan><tspan fill="#e6edf3">  </tspan><tspan fill="#e6edf3" font-weight="700">No effort set — Opus 5.5 defaults to "medium" (Opus 5 / 4.8 / 4.7 / Sonnet 5 default to "high")</tspan><tspan fill="#e6edf3"> </tspan></text>
<text x="22" y="559" xml:space="preserve"><tspan fill="#8b949e">      </tspan><tspan fill="#8b949e">[effort-default]</tspan></text>
<text x="22" y="579" xml:space="preserve"><tspan fill="#e6edf3">    </tspan><tspan fill="#56d4dd">requests #1, #2</tspan><tspan fill="#e6edf3">  </tspan><tspan fill="#8b949e">model=claude-opus-5-5  ua=langchain-anthropic/1.7.4</tspan></text>
<text x="22" y="599" xml:space="preserve"><tspan fill="#e6edf3">    </tspan><tspan fill="#7ee787">fix:</tspan><tspan fill="#e6edf3"> Set `output_config.effort` explicitly and re-run an effort sweep on your own evals; the same level name</tspan></text>
<text x="22" y="619" xml:space="preserve"><tspan fill="#e6edf3">          </tspan><tspan fill="#e6edf3">is not the same thinking budget across models.</tspan></text>
<text x="22" y="639" xml:space="preserve"><tspan fill="#e6edf3">    </tspan><tspan fill="#8b949e">docs: https://platform.claude.com/docs/en/build-with-claude/effort</tspan></text>
<text x="22" y="659" xml:space="preserve"></text>
<text x="22" y="679" xml:space="preserve"><tspan fill="#e6edf3" font-weight="700">Summary:</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#ff7b72">2/2 requests would be rejected by Opus 5.5</tspan><tspan fill="#e6edf3"> · </tspan><tspan fill="#e3b341">2 warnings</tspan><tspan fill="#e6edf3"> · </tspan><tspan fill="#79c0ff">0 info</tspan></text>
</g>
</svg>
